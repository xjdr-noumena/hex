# Derived from openai/codex 943a21829d (codex-rs/codex-api), Apache-2.0: the realtime layer only
# (WebRTC call creation and the realtime/sideband WebSocket client).
# Hex changes: explicit versions; no network policy, custom CA, or Windows platform-verifier TLS;
# upstream tokio-tungstenite/tungstenite 0.28 instead of OpenAI's forks.
[package]
name = "codex-realtime-api"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
async-channel = "2.5.0"
bytes = "1.12.1"
codex-client = { path = "../codex-client" }
codex-http-client = { path = "../http-client" }
codex-protocol = { path = "../protocol" }
codex-utils-rustls-provider = { path = "../utils-rustls-provider" }
codex-websocket-client = { path = "../websocket-client" }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = "0.28.0"
tracing = "0.1.44"
tungstenite = "0.28.0"
url = "2.5.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
tokio = { version = "1.54.1", features = ["test-util"] }
