# Shim for openai/codex's codex-http-client (943a21829d, codex-rs/http-client), Apache-2.0: the
# request/response types, TransportError, Retry-After parsing, and a plain reqwest transport over
# rustls with the platform's trusted roots. No network policy, proxy routing, custom CA, cookie
# store, or request compression.
[package]
name = "codex-http-client"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
doctest = false
test = false

[lints]
workspace = true

[dependencies]
bytes = "1.12.1"
codex-utils-rustls-provider = { path = "../utils-rustls-provider" }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
http = "1.5.0"
httpdate = "1.0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-native-roots-no-provider", "stream"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1.44"
